name: learntrack-poc

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: learntrack
      POSTGRES_USER: learntrack
      POSTGRES_PASSWORD: learntrack
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learntrack -d learntrack"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingestion-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE_NAME: ingestion-service
    environment: &svc-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/learntrack
      SPRING_DATASOURCE_USERNAME: learntrack
      SPRING_DATASOURCE_PASSWORD: learntrack
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      SPRING_DATA_REDIS_HOST: redis
      LEARNTRACK_JWT_SECRET: learntrack-poc-dev-secret-change-me-please-32b
    ports:
      - "8081:8081"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  profile-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE_NAME: profile-service
    environment: *svc-env
    ports:
      - "8082:8082"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  risk-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE_NAME: risk-service
    environment: *svc-env
    ports:
      - "8083:8083"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  intervention-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE_NAME: intervention-service
    environment: *svc-env
    ports:
      - "8084:8084"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  consent-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE_NAME: consent-service
    environment: *svc-env
    ports:
      - "8085:8085"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  reporting-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE_NAME: reporting-service
    environment: *svc-env
    ports:
      - "8086:8086"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }

volumes:
  pgdata:
